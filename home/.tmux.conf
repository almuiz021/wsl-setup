# ~/.tmux.conf — sensible modern defaults.

# True colour + 256 colour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# Mouse on (scroll, select, resize panes)
set -g mouse on

# Start windows/panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key response, bigger scrollback
set -sg escape-time 10
set -g history-limit 50000

# Vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Intuitive splits, keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Alt+arrow to move between PANES (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Fast WINDOW switching, no prefix ─────────────────────────────────────────
# Alt + QWERTY-row -> windows 1..10 (left hand, no number-row reach).
bind -n M-q select-window -t 1
bind -n M-w select-window -t 2
bind -n M-e select-window -t 3
bind -n M-r select-window -t 4
bind -n M-t select-window -t 5
bind -n M-y select-window -t 6
bind -n M-u select-window -t 7
bind -n M-i select-window -t 8
bind -n M-o select-window -t 9
bind -n M-p select-window -t 10

# Alt+s -> switch PROJECT (jump between tmux sessions). The piece plain
# window-keys miss: this hops between different projects/clients.
bind -n M-s choose-tree -Zs
# Alt+c -> new window here; Alt+, -> rename window.
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-, command-prompt -I "#W" "rename-window '%%'"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Status bar
set -g status-interval 5
set -g status-style "bg=default fg=white"
set -g status-left "#[fg=green,bold]#S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M "
set -g status-justify centre
setw -g window-status-current-style "fg=black,bg=cyan,bold"
