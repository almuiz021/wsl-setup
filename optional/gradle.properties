# Memory caps for the 4GB WSL2 VM — an uncapped Gradle daemon hit 2.4GB RSS and
# OOM-crashed the whole VM (2026-06-12). Per-project gradle.properties can still
# override these, so keep project files lean too.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m
# Stop idle daemons sooner than the 3h default (ms)
org.gradle.daemon.idletimeout=1800000
